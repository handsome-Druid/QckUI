name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:python3.14-trixie-slim
    environment: pypi

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - run: uv build
      - run: uv publish
